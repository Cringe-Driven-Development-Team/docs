name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run modules:check
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: docs-render:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/cache@v4
        with:
          path: .eraser/icons
          key: icons-${{ hashFiles('diagrams/**/*.json') }}
          restore-keys: |
            icons-
      - run: >-
          docker run --rm -v "$PWD:/work" -w /work docs-render:ci
          bash -c "bun install --frozen-lockfile && bun run wiki:prepare"
      - run: >-
          docker run --rm -v "$PWD:/work" -v "$PWD/.openwiki-sources:/openwiki-sources:ro"
          -e OPENWIKI_SOURCES_DIR=/openwiki-sources -w /work docs-render:ci
          bash -c "bun install --frozen-lockfile && bun run typecheck && bun run test && bun run build && bun run wiki:browser dist/openwiki && bun run wiki:browser --fixture"
      - uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: dist
