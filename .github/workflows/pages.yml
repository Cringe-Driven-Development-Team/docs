name: Pages

on:
  push:
    branches:
      - "**"
  delete:
  workflow_dispatch:
  schedule:
    - cron: "7 3-20 * * *"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  board:
    if: github.ref == 'refs/heads/main' && github.event_name != 'delete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun scripts/board.ts sync
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
      - if: always()
        run: bun scripts/board.ts snapshot board.json
        env:
          GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: board
          path: board.json
          if-no-files-found: ignore

  build:
    needs: board
    if: always() && (github.ref == 'refs/heads/main' && (github.event_name != 'delete' || github.event.ref_type == 'branch'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: board
          path: site/modules
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: docs-render:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: icons
        uses: actions/cache/restore@v4
        with:
          path: .eraser/icons
          key: icons-${{ hashFiles('diagrams/**/*.json') }}
          restore-keys: |
            icons-
      - run: >-
          docker run --rm -v "$PWD:/work" -w /work docs-render:ci
          bash -c "bun install --frozen-lockfile && bun run typecheck && bun run test && bun run build"
      - if: steps.icons.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .eraser/icons
          key: icons-${{ hashFiles('diagrams/**/*.json') }}
      - run: >-
          docker run --rm -v "$PWD:/work" -v "$GITHUB_STEP_SUMMARY:$GITHUB_STEP_SUMMARY"
          -e GITHUB_STEP_SUMMARY -w /work docs-render:ci bash -c "bun run site --main-built"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
